[project]
name = "canvit-eval"
version = "0.1.0"
description = "Evaluation and benchmarking for CanViT"
requires-python = ">=3.12"
dependencies = [
    "canvit-pytorch",
    "canvit-probes",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["canvit_eval"]

[dependency-groups]
dev = [
    "basedpyright>=1.37.2",
    "pytest>=9.0.2",
    "pypatree>=0.4.0",
    "ruff>=0.14.14",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120

[tool.uv.sources]
canvit-pytorch = { git = "https://github.com/m2b3/CanViT-PyTorch.git" }
canvit-probes = { git = "ssh://git@github.com/m2b3/CanViT-probes.git", branch = "sdu/rename-to-mmIoUAccumulator" }
